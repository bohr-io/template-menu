<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title data-i18n="page.title">Cardápio</title>
    <meta name="description" content="Veja o cardápio e faça seu pedido pelo WhatsApp." />
    <meta name="theme-color" content="#c2410c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body class="menu-page">
    <header class="store-header">
      <div class="container store-head">
        <div id="store-mark" class="store-mark" aria-hidden="true"></div>
        <div class="store-copy">
          <h1 id="store-name"></h1>
          <p id="store-description" class="store-description"></p>
          <ul id="store-info" class="store-info"></ul>
        </div>
      </div>
    </header>

    <nav id="category-nav" class="category-nav" data-i18n-label="menu.categories" hidden>
      <div class="container">
        <ul id="category-links" class="category-links"></ul>
      </div>
    </nav>

    <main id="menu" class="container menu-main">
      <p id="closed-notice" class="alert warning" hidden data-i18n="store.closedNotice"></p>
      <div id="sections" aria-busy="true"></div>
      <p id="menu-empty" class="empty" hidden data-i18n="menu.empty"></p>
      <div id="menu-error" class="alert error row spread" role="alert" hidden>
        <span id="menu-error-text"></span>
        <button id="menu-retry" class="btn small" type="button" data-i18n="menu.retry"></button>
      </div>
    </main>

    <div id="cart-bar" class="cart-bar" hidden>
      <button id="open-cart" class="btn primary cart-bar-button" type="button" aria-haspopup="dialog" aria-controls="cart">
        <span id="cart-bar-count" class="cart-bar-count"></span>
        <span class="grow" data-i18n="cart.view"></span>
        <span id="cart-bar-total" class="cart-bar-total"></span>
      </button>
    </div>

    <dialog id="cart" class="drawer" aria-labelledby="cart-title">
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2 id="cart-title" data-i18n="cart.title"></h2>
          <button id="close-cart" class="btn ghost icon-btn" type="button" data-i18n-label="cart.close" data-i18n-title="cart.close">✕</button>
        </div>

        <div id="cart-view" class="drawer-body">
          <p id="cart-message" class="alert warning" role="status" hidden></p>
          <p id="cart-empty" class="empty" data-i18n="cart.empty"></p>
          <ul id="cart-lines" class="cart-lines"></ul>

          <form id="checkout" class="stack checkout" novalidate>
            <h3 data-i18n="checkout.title"></h3>
            <label class="field">
              <span data-i18n="checkout.name"></span>
              <input name="name" autocomplete="name" required minlength="2" maxlength="100" />
            </label>
            <fieldset id="fulfillment" class="field">
              <legend data-i18n="checkout.fulfillment"></legend>
              <div class="choice-row">
                <label class="choice"><input type="radio" name="fulfillment" value="pickup" checked /> <span data-i18n="checkout.pickup"></span></label>
                <label class="choice" id="choice-delivery"><input type="radio" name="fulfillment" value="delivery" /> <span data-i18n="checkout.delivery"></span></label>
              </div>
            </fieldset>
            <label class="field" id="field-address" hidden>
              <span data-i18n="checkout.address"></span>
              <textarea name="address" rows="2" minlength="5" maxlength="300" autocomplete="street-address" data-i18n-placeholder="checkout.addressPlaceholder"></textarea>
            </label>
            <label class="field">
              <span><span data-i18n="checkout.phone"></span> <span class="muted small">(<span data-i18n="checkout.optional"></span>)</span></span>
              <input name="phone" type="tel" autocomplete="tel" maxlength="30" />
            </label>
            <label class="field">
              <span><span data-i18n="checkout.note"></span> <span class="muted small">(<span data-i18n="checkout.optional"></span>)</span></span>
              <textarea name="note" rows="2" maxlength="500" data-i18n-placeholder="checkout.notePlaceholder"></textarea>
            </label>
            <label class="honeypot" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off" /></label>

            <dl class="totals">
              <div><dt data-i18n="cart.subtotal"></dt><dd id="total-subtotal"></dd></div>
              <div id="total-fee-row" hidden><dt data-i18n="cart.fee"></dt><dd id="total-fee"></dd></div>
              <div class="grand"><dt data-i18n="cart.total"></dt><dd id="total-total"></dd></div>
            </dl>
            <p id="checkout-notice" class="alert warning" role="status" hidden></p>
            <p id="checkout-error" class="alert error" role="alert" hidden></p>
            <button id="checkout-submit" class="btn primary block big" type="submit" data-i18n="checkout.submit"></button>
            <p class="muted small center" data-i18n="checkout.hint"></p>
          </form>
        </div>

        <section id="done" class="drawer-body done" hidden tabindex="-1" aria-labelledby="done-title">
          <div class="done-icon" aria-hidden="true">✓</div>
          <h2 id="done-title"></h2>
          <p class="muted" data-i18n="done.text"></p>
          <a id="whatsapp-link" class="btn whatsapp block big" href="#" target="_blank" rel="noopener">
            <svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.2-.2-.5-.3Z"/></svg>
            <span data-i18n="done.send"></span>
          </a>
          <p class="muted small" data-i18n="done.blocked"></p>
          <button id="new-order" class="btn block" type="button" data-i18n="done.again"></button>
        </section>
      </div>
    </dialog>
  </body>
</html>
